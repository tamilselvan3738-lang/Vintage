<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 Page Not Found | Vinyl Oasis Sanctuary</title>
  <meta name="description" content="The requested analog studio page could not be found. Navigate back to the flagship turntable and high-fidelity collection catalog.">
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f6fc;
      background-image: radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.05) 0%, transparent 40%), 
                        radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
      color: #1b1624;
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ----- DARK MODE ----- */
    body.dark {
      background-color: #0b0714;
      background-image: radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 45%), 
                        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.12) 0%, transparent 45%);
      color: #e4dee8;
    }

    /* ----- RTL MODE ----- */
    body.rtl {
      direction: rtl;
    }
    body.rtl .home-btn i {
      transform: rotate(180deg);
    }
    body.rtl .home-btn:hover i {
      transform: rotate(180deg) translateX(-4px);
    }

    /* ----- TOP RIGHT ACTIONS ----- */
    .top-actions {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }
    body.rtl .top-actions {
      right: auto;
      left: 24px;
    }

    .icon-btn {
      background: rgba(124, 58, 237, 0.04);
      border: 1px solid rgba(124, 58, 237, 0.08);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: clamp(0.9rem, 0.7rem + 0.5vw, 1.2rem);
      color: #584f6b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }
    body.dark .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      color: #d8d0e0;
    }
    .icon-btn:hover {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #ffffff;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }
    body.dark .icon-btn:hover {
      background: #fcd34d;
      border-color: #fcd34d;
      color: #0b0714;
      box-shadow: 0 8px 20px rgba(252, 211, 77, 0.3);
    }

    /* ----- AMBIENT FLOATING BLOBS ----- */
    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: floatBlob 10s infinite alternate ease-in-out;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: rgba(124, 58, 237, 0.08);
      top: 15%;
      left: 10%;
    }
    .blob-2 {
      width: 350px;
      height: 350px;
      background: rgba(245, 158, 11, 0.06);
      bottom: 15%;
      right: 10%;
    }
    body.dark .blob-1 { background: rgba(124, 58, 237, 0.15); }
    body.dark .blob-2 { background: rgba(245, 158, 11, 0.12); }

    @keyframes floatBlob {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.1); }
    }

    /* ----- CENTER ERROR CONTAINER ----- */
    .error-wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .record-graphic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2e1065 0%, #581c87 100%);
      border: 3px solid #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(124, 58, 237, 0.2);
      margin-bottom: 2rem;
      position: relative;
      animation: spinRecord 12s linear infinite;
    }
    body.dark .record-graphic {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
      border-color: #fcd34d;
    }
    .record-graphic::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px dashed rgba(245, 158, 11, 0.5);
    }
    .record-graphic i {
      font-size: 3.5rem;
      color: #fef3c7;
      z-index: 1;
    }
    body.dark .record-graphic i {
      color: #ffffff;
    }

    @keyframes spinRecord {
      100% { transform: rotate(360deg); }
    }

    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4.5rem, 15vw, 8rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #2e1065 20%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    body.dark .error-code {
      background: linear-gradient(135deg, #ffffff 20%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: #2e1065;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
    }
    body.dark .error-title {
      color: #fcd34d;
    }

    .error-desc {
      color: #584f6b;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    body.dark .error-desc {
      color: #a49ab0;
    }

    /* CENTERED BUTTON */
    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 56px;
      padding: 0 36px;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #f59e0b 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(0.95rem, 0.75rem + 1vw, 1.25rem);
      text-decoration: none;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dark .home-btn {
      background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
      color: #0b0714 !important;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(124, 58, 237, 0.4);
      background: linear-gradient(135deg, #6d28d9 0%, #d97706 100%);
    }
    body.dark .home-btn:hover {
      background: linear-gradient(135deg, #fde68a 0%, #d97706 100%);
      box-shadow: 0 14px 30px rgba(245, 158, 11, 0.4);
    }
    .home-btn i {
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .home-btn:hover i {
      transform: translateX(-4px);
    }
  /* MOBILE / TABLET (<= 1280px) */
    .mobile-menu-btn {
      display: none;
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.15);
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      border-radius: 14px;
      cursor: pointer;
      color: #7c3aed;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    body.dark .mobile-menu-btn {
      background: rgba(252, 211, 77, 0.12);
      border-color: rgba(252, 211, 77, 0.18);
      color: #fcd34d;
    }
    .mobile-menu-btn:hover {
      background: #7c3aed;
      color: #ffffff;
    }
    body.dark .mobile-menu-btn:hover {
      background: #fcd34d;
      color: #0b0714;
    }
    @media (max-width: 1440px) {
      .nav-menu { display: none; }
      .nav-actions { display: none; }
      .mobile-menu-btn { display: flex; }
    }
    /* side drawer */
    .mobile-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 400px;
      height: 100vh;
      background: rgba(255, 253, 255, 0.98);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 2000;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 30px 24px;
      box-shadow: -15px 0 50px rgba(0,0,0,0.15);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 1px solid rgba(124, 58, 237, 0.12);
    }
    body.dark .mobile-drawer {
      background: rgba(11, 7, 20, 0.98);
      border-left-color: rgba(255, 255, 255, 0.08);
      box-shadow: -15px 0 50px rgba(0,0,0,0.8);
    }
    .mobile-drawer.open {
      right: 0;
    }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1999;
      display: none;
    }
    .mobile-drawer .nav-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      color: #3b304c;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    body.dark .mobile-drawer .nav-link {
      color: #d8d0e0;
    }
    .mobile-drawer .nav-link:hover {
      background: rgba(124, 58, 237, 0.08);
      color: #7c3aed;
      transform: translateX(6px);
    }
    body.dark .mobile-drawer .nav-link:hover {
      background: rgba(252, 211, 77, 0.1);
      color: #fcd34d;
    }
    .mobile-drawer .nav-link i {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 58, 237, 0.1);
      color: #7c3aed;
      border-radius: 10px;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    body.dark .mobile-drawer .nav-link i {
      background: rgba(252, 211, 77, 0.12);
      color: #fcd34d;
    }
    .mobile-drawer .nav-link:hover i {
      background: #7c3aed;
      color: #ffffff;
    }
    body.dark .mobile-drawer .nav-link:hover i {
      background: #fcd34d;
      color: #0b0714;
    }
    .mobile-dropdown .dropdown-menu {
      position: static;
      opacity: 1;
      visibility: visible;
      transform: none;
      box-shadow: none;
      background: transparent;
      padding: 4px 0 4px 20px;
      display: none;
      border: none;
    }
    .mobile-dropdown.active .dropdown-menu { display: block; }

    /* Mobile Login Button Pro Style */
    .mobile-drawer-login {
      width: 100%;
      height: 56px; /* Optimized height for visual hierarchy */
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #f59e0b 100%);
      border: none;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 0.75rem + 1vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.25), inset 0 1px 2px rgba(255,255,255,0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dark .mobile-drawer-login {
      background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
      color: #0b0714 !important;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25), inset 0 1px 2px rgba(255,255,255,0.4);
    }
    .mobile-drawer-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(124, 58, 237, 0.4);
      background: linear-gradient(135deg, #6d28d9 0%, #d97706 100%);
    }
    body.dark .mobile-drawer-login:hover {
      background: linear-gradient(135deg, #fde68a 0%, #d97706 100%);
      box-shadow: 0 14px 30px rgba(245, 158, 11, 0.4);
    }

    
    </style>
</head>
<body>

  <!-- AMBIENT FLOATING BLOBS -->
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <!-- TOP RIGHT ACTIONS (Dark Mode & RTL Buttons Only) -->
  <div class="top-actions">
    <button class="icon-btn" id="darkModeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" id="rtlToggle" aria-label="Toggle RTL direction"><i class="fa-solid fa-right-left"></i></button>
  </div>

  <!-- CENTER CONTENT -->
  <div class="error-wrapper">
    <div class="record-graphic">
      <i class="fas fa-compact-disc"></i>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Analogue Groove Not Found</h1>
    <p class="error-desc">The tone-arm has reached the silent end of the run-out groove. The specific studio release or page you are searching for has drifted into ambient static.</p>
    
    <!-- Centered Back to home page button -->
    <div>
      <a href="index.html" class="home-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to home page</span>
      </a>
    </div>
  </div>

  <script>
    (function(){
      const body = document.body;
      const darkToggle = document.getElementById('darkModeToggle');
      const rtlToggle = document.getElementById('rtlToggle');

      // ---------- DARK MODE ----------
      function setDarkMode(enabled) {
        if(enabled) body.classList.add('dark');
        else body.classList.remove('dark');
        localStorage.setItem('vinyl_dark', enabled ? 'true' : 'false');
        const icon = darkToggle?.querySelector('i');
        if(icon) {
          if(enabled) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
          else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
        }
      }
      const savedDark = localStorage.getItem('vinyl_dark') === 'true';
      if(savedDark) setDarkMode(true);
      darkToggle?.addEventListener('click', () => setDarkMode(!body.classList.contains('dark')));

      // ---------- RTL MODE ----------
      function setRTL(enabled) {
        if(enabled) body.classList.add('rtl');
        else body.classList.remove('rtl');
        localStorage.setItem('vinyl_rtl', enabled ? 'true' : 'false');
        const arrowIcon = rtlToggle?.querySelector('i');
        if(arrowIcon) {
          if(enabled) arrowIcon.classList.replace('fa-arrow-right', 'fa-arrow-left');
          else arrowIcon.classList.replace('fa-arrow-left', 'fa-arrow-right');
        }
      }
      const savedRTL = localStorage.getItem('vinyl_rtl') === 'true';
      if(savedRTL) setRTL(true);
      rtlToggle?.addEventListener('click', () => setRTL(!body.classList.contains('rtl')));
    
      // ---------- MOBILE DRAWER ----------
      const mobileHamburger = document.getElementById('mobileHamburger');
      const mobileDrawer = document.getElementById('mobileDrawer');
      const drawerOverlay = document.getElementById('drawerOverlay');
      const closeDrawerBtn = document.getElementById('closeDrawer');
      const mobileDarkToggle = document.getElementById('mobileDarkToggle');
      const mobileRtlToggle = document.getElementById('mobileRtlToggle');
      const mobileLoginBtn = document.getElementById('mobileLoginBtn');
      const home1Option = document.getElementById('home1Option');
      const home2Option = document.getElementById('home2Option');
      const mobileHome1 = document.getElementById('mobileHome1');
      const mobileHome2 = document.getElementById('mobileHome2');

      // mobile toggles
      mobileDarkToggle?.addEventListener('click', () => { 
        const isDark = body.classList.contains('dark');
        if(!isDark) body.classList.add('dark'); else body.classList.remove('dark');
        localStorage.setItem('vinyl_dark', !isDark ? 'true' : 'false');
      });
      mobileRtlToggle?.addEventListener('click', () => { 
        const isRtl = body.classList.contains('rtl');
        if(!isRtl) body.classList.add('rtl'); else body.classList.remove('rtl');
        localStorage.setItem('vinyl_rtl', !isRtl ? 'true' : 'false');
      });
      mobileLoginBtn?.addEventListener('click', () => { window.location.href = './login.html'; });

      home1Option?.addEventListener('click', () => { closeDrawerIfOpen(); });
      home2Option?.addEventListener('click', () => { closeDrawerIfOpen(); });
      mobileHome1?.addEventListener('click', () => { closeDrawerIfOpen(); });
      mobileHome2?.addEventListener('click', () => { closeDrawerIfOpen(); });

      function closeDrawer() {
        if(mobileDrawer) mobileDrawer.classList.remove('open');
        if(drawerOverlay) drawerOverlay.style.display = 'none';
      }
      function closeDrawerIfOpen() {
        if(mobileDrawer?.classList.contains('open')) closeDrawer();
      }
      mobileHamburger?.addEventListener('click', () => {
        if(mobileDrawer) mobileDrawer.classList.add('open');
        if(drawerOverlay) drawerOverlay.style.display = 'block';
      });
      closeDrawerBtn?.addEventListener('click', closeDrawer);
      drawerOverlay?.addEventListener('click', closeDrawer);

      document.querySelectorAll('.mobile-dropdown').forEach(dropdown => {
        const header = dropdown.querySelector('div:first-child');
        header?.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdown.classList.toggle('active');
        });
      });

      })();
  </script>
</body>
</html>
