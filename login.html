<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | Vinyl Oasis Sanctuary</title>
  <meta name="description" content="Secure access to your Vinyl Oasis analog collector account, bespoke turntable preferences, and high-fidelity audition scheduling console.">
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Hide scrollbar visually and lock viewport to a single screen */
    html, body {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none; /* Chrome, Safari and Opera */
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f6fc;
      background-image: radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.05) 0%, transparent 40%), 
                        radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
      color: #1b1624;
      transition: background 0.4s ease, color 0.4s ease;
      position: relative;
    }

    /* ----- DARK MODE (Immersive Deep Studio aesthetic) ----- */
    body.dark {
      background-color: #0b0714;
      background-image: radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 45%), 
                        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.12) 0%, transparent 45%);
      color: #e4dee8;
    }

    /* ----- RTL (right-to-left) support ----- */
    body.rtl {
      direction: rtl;
    }

    /* ----- TOP RIGHT ACTIONS (Dark Mode & RTL Buttons) ----- */
    .top-actions {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }
    body.rtl .top-actions {
      right: auto;
      left: 24px;
    }

    .icon-btn {
      background: rgba(124, 58, 237, 0.04);
      border: 1px solid rgba(124, 58, 237, 0.08);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: clamp(0.9rem, 0.7rem + 0.5vw, 1.2rem);
      color: #584f6b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body.dark .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      color: #d8d0e0;
    }
    .icon-btn:hover {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #ffffff;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }
    body.dark .icon-btn:hover {
      background: #fcd34d;
      border-color: #fcd34d;
      color: #0b0714;
      box-shadow: 0 8px 20px rgba(252, 211, 77, 0.3);
    }

    /* ----- AMBIENT FLOATING BLOBS ----- */
    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: floatBlob 10s infinite alternate ease-in-out;
    }
    .blob-1 {
      width: 450px;
      height: 450px;
      background: rgba(124, 58, 237, 0.1);
      top: 10%;
      left: 15%;
    }
    .blob-2 {
      width: 400px;
      height: 400px;
      background: rgba(245, 158, 11, 0.08);
      bottom: 10%;
      right: 15%;
    }
    body.dark .blob-1 { background: rgba(124, 58, 237, 0.2); }
    body.dark .blob-2 { background: rgba(245, 158, 11, 0.15); }

    @keyframes floatBlob {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    /* ----- CENTERED LOGIN WRAPPER ----- */
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      padding: 1rem;
      position: relative;
      z-index: 1;
      overflow-y: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
    }
    .login-wrapper::-webkit-scrollbar {
      display: none; /* Chrome, Safari and Opera */
    }

    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(124, 58, 237, 0.15);
      box-shadow: 0 25px 60px -15px rgba(124, 58, 237, 0.15), 0 0 1px rgba(0,0,0,0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 1.75rem 2rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dark .login-card {
      background: rgba(14, 9, 24, 0.85);
      border-color: rgba(245, 158, 11, 0.15);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95), 0 0 30px rgba(124, 58, 237, 0.15);
    }

    /* ----- LOGO (Exact Replicated Styles from Index) ----- */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .logo:hover {
      transform: translateY(-1px) scale(1.02);
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2e1065 0%, #581c87 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15), inset 0 1px 2px rgba(255,255,255,0.1);
      border: 2px solid #f59e0b;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .logo-icon::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .logo:hover .logo-icon {
      border-color: #f59e0b;
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.35), inset 0 1px 2px rgba(255,255,255,0.2);
    }
    .logo-icon i {
      font-size: 16px;
      color: #fef3c7;
      z-index: 1;
      transition: color 0.3s;
    }
    .logo:hover .logo-icon i {
      color: #ffffff;
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.3px;
      line-height: 1.1;
      background: linear-gradient(135deg, #2e1065 20%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.3s;
    }
    body.dark .logo-text {
      background: linear-gradient(135deg, #ffffff 20%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo small {
      font-family: 'Inter', sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      display: block;
      letter-spacing: 1.5px;
      color: #7c3aed;
      margin-top: 1px;
    }
    body.dark .logo small {
      color: #fbbf24;
    }

    /* ----- FORM STYLES ----- */
    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: #2e1065;
      margin-bottom: 2px;
      text-align: center;
      letter-spacing: -0.4px;
    }
    body.dark .form-title { color: #ffffff; }

    .form-subtitle {
      font-size: 0.82rem;
      color: #7c6f8d;
      text-align: center;
      margin-bottom: 1.25rem;
    }
    body.dark .form-subtitle { color: #a49ab0; }

    .input-group {
      margin-bottom: 0.85rem;
      position: relative;
    }
    .input-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #443a55;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    body.dark .input-label { color: #d8d0e0; }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 16px;
      color: #8c829c;
      font-size: 1rem;
      transition: color 0.3s;
      pointer-events: none;
    }
    body.rtl .input-icon {
      left: auto;
      right: 16px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      background: rgba(124, 58, 237, 0.02);
      border: 1px solid rgba(124, 58, 237, 0.12);
      border-radius: 12px;
      padding: 0 16px 0 42px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: #1b1624;
      transition: all 0.3s;
      outline: none;
    }
    body.rtl .form-input {
      padding: 0 42px 0 16px;
    }
    body.dark .form-input {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .form-input:focus {
      background: #ffffff;
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
    }
    body.dark .form-input:focus {
      background: rgba(11, 7, 20, 0.9);
      border-color: #fcd34d;
      box-shadow: 0 0 0 4px rgba(252, 211, 77, 0.15);
    }
    .form-input:focus ~ .input-icon {
      color: #7c3aed;
    }
    body.dark .form-input:focus ~ .input-icon {
      color: #fcd34d;
    }

    /* Eye Icon Toggle */
    .eye-btn {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: #8c829c;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.rtl .eye-btn {
      right: auto;
      left: 16px;
    }
    .eye-btn:hover {
      color: #7c3aed;
    }
    body.dark .eye-btn:hover {
      color: #fcd34d;
    }

    /* Options Row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      font-size: 0.8rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #584f6b;
      font-weight: 500;
      user-select: none;
      position: relative;
    }
    body.dark .checkbox-label { color: #c0b6ca; }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: rgba(255,255,255,0.5);
      color: transparent;
      font-size: 0.7rem;
    }
    body.dark .custom-checkbox {
      background: rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.2);
    }
    input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }
    input[type="checkbox"]:checked ~ .custom-checkbox {
      background: #7c3aed;
      border-color: #7c3aed;
      color: white;
    }
    body.dark input[type="checkbox"]:checked ~ .custom-checkbox {
      background: #fcd34d;
      border-color: #fcd34d;
      color: #0b0714;
    }

    .forgot-link {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    body.dark .forgot-link { color: #fcd34d; }
    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed 0%, #f59e0b 100%);
      border: none;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.5px;
      box-shadow: 0 6px 15px rgba(124, 58, 237, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    body.dark .submit-btn {
      background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
      color: #0b0714 !important;
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35);
      background: linear-gradient(135deg, #6d28d9 0%, #d97706 100%);
    }
    body.dark .submit-btn:hover {
      background: linear-gradient(135deg, #fde68a 0%, #d97706 100%);
      box-shadow: 0 10px 24px rgba(245, 158, 11, 0.35);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin-bottom: 0.85rem;
      color: #8c829c;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(124, 58, 237, 0.1);
    }
    body.dark .divider::before, body.dark .divider::after {
      border-bottom-color: rgba(255, 255, 255, 0.08);
    }
    .divider span {
      padding: 0 14px;
    }

    /* Social Logins */
    .social-logins {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.15rem;
    }
    .social-btn-card {
      height: 38px;
      border-radius: 10px;
      background: rgba(124, 58, 237, 0.02);
      border: 1px solid rgba(124, 58, 237, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #443a55;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    body.dark .social-btn-card {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.06);
      color: #d8d0e0;
    }
    .social-btn-card:hover {
      background: #ffffff;
      border-color: #7c3aed;
      color: #7c3aed;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(124, 58, 237, 0.1);
    }
    body.dark .social-btn-card:hover {
      background: rgba(11, 7, 20, 0.8);
      border-color: #fcd34d;
      color: #fcd34d;
      box-shadow: 0 6px 15px rgba(252, 211, 77, 0.15);
    }

    /* Create Account / Registration Redirect */
    .register-prompt {
      text-align: center;
      font-size: 0.82rem;
      color: #584f6b;
      margin-top: 0.25rem;
      border-top: 1px solid rgba(124, 58, 237, 0.08);
      padding-top: 1rem;
    }
    body.dark .register-prompt {
      color: #a49ab0;
      border-top-color: rgba(255, 255, 255, 0.06);
    }
    .register-link {
      color: #7c3aed;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
      margin-left: 4px;
    }
    body.rtl .register-link { margin-left: 0; margin-right: 4px; }
    body.dark .register-link { color: #fcd34d; }
    .register-link:hover {
      text-decoration: underline;
    }
  /* MOBILE / TABLET (<= 1280px) */
    .mobile-menu-btn {
      display: none;
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.15);
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      border-radius: 14px;
      cursor: pointer;
      color: #7c3aed;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    body.dark .mobile-menu-btn {
      background: rgba(252, 211, 77, 0.12);
      border-color: rgba(252, 211, 77, 0.18);
      color: #fcd34d;
    }
    .mobile-menu-btn:hover {
      background: #7c3aed;
      color: #ffffff;
    }
    body.dark .mobile-menu-btn:hover {
      background: #fcd34d;
      color: #0b0714;
    }
    @media (max-width: 1440px) and (min-width: 1025px) {
      .navbar {
        padding: 0.5rem 1rem;
        gap: 0.5rem;
      }
      .logo {
        gap: 8px;
      }
      .logo-icon {
        width: 38px;
        height: 38px;
      }
      .logo-icon i {
        font-size: 18px;
      }
      .logo-text {
        font-size: 1.1rem;
      }
      .logo small {
        font-size: 0.55rem;
        letter-spacing: 1px;
      }
      .nav-menu {
        gap: 0.05rem;
        padding: 0.2rem 0.3rem;
      }
      .nav-link {
        padding: 4px 8px;
        font-size: 0.72rem;
        gap: 4px;
      }
      .nav-link i {
        font-size: 8px;
      }
      .nav-actions {
        gap: 6px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
      }
      .login-btn {
        padding: 0 16px;
        height: 38px;
        border-radius: 10px;
        font-size: 0.8rem;
        gap: 6px;
      }
    }
    @media (max-width: 1024px) {
      .nav-menu { display: none; }
      .nav-actions { display: none; }
      .mobile-menu-btn { display: flex; }
    }
    /* side drawer */
    .mobile-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 400px;
      height: 100vh;
      background: rgba(255, 253, 255, 0.98);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 2000;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 30px 24px;
      box-shadow: -15px 0 50px rgba(0,0,0,0.15);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 1px solid rgba(124, 58, 237, 0.12);
    }
    body.dark .mobile-drawer {
      background: rgba(11, 7, 20, 0.98);
      border-left-color: rgba(255, 255, 255, 0.08);
      box-shadow: -15px 0 50px rgba(0,0,0,0.8);
    }
    .mobile-drawer.open {
      right: 0;
    }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1999;
      display: none;
    }
    .mobile-drawer .nav-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      color: #3b304c;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    body.dark .mobile-drawer .nav-link {
      color: #d8d0e0;
    }
    .mobile-drawer .nav-link:hover {
      background: rgba(124, 58, 237, 0.08);
      color: #7c3aed;
      transform: translateX(6px);
    }
    body.dark .mobile-drawer .nav-link:hover {
      background: rgba(252, 211, 77, 0.1);
      color: #fcd34d;
    }
    .mobile-drawer .nav-link i {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 58, 237, 0.1);
      color: #7c3aed;
      border-radius: 10px;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    body.dark .mobile-drawer .nav-link i {
      background: rgba(252, 211, 77, 0.12);
      color: #fcd34d;
    }
    .mobile-drawer .nav-link:hover i {
      background: #7c3aed;
      color: #ffffff;
    }
    body.dark .mobile-drawer .nav-link:hover i {
      background: #fcd34d;
      color: #0b0714;
    }
    .mobile-dropdown .dropdown-menu {
      position: static;
      opacity: 1;
      visibility: visible;
      transform: none;
      box-shadow: none;
      background: transparent;
      padding: 4px 0 4px 20px;
      display: none;
      border: none;
    }
    .mobile-dropdown.active .dropdown-menu { display: block; }

    /* Mobile Login Button Pro Style */
    .mobile-drawer-login {
      width: 100%;
      height: 56px; /* Optimized height for visual hierarchy */
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #f59e0b 100%);
      border: none;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 0.75rem + 1vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.25), inset 0 1px 2px rgba(255,255,255,0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dark .mobile-drawer-login {
      background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 100%);
      color: #0b0714 !important;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25), inset 0 1px 2px rgba(255,255,255,0.4);
    }
    .mobile-drawer-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(124, 58, 237, 0.4);
      background: linear-gradient(135deg, #6d28d9 0%, #d97706 100%);
    }
    body.dark .mobile-drawer-login:hover {
      background: linear-gradient(135deg, #fde68a 0%, #d97706 100%);
      box-shadow: 0 14px 30px rgba(245, 158, 11, 0.4);
    }

    
    </style>
</head>
<body>

  <!-- AMBIENT FLOATING BLOBS -->
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <!-- TOP RIGHT ACTIONS (Dark Mode & RTL Buttons) -->
  <div class="top-actions">
    <button class="icon-btn" id="darkModeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" id="rtlToggle" aria-label="Toggle RTL direction"><i class="fa-solid fa-right-left"></i></button>
  </div>

  <!-- CENTERED LOGIN WRAPPER -->
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- CENTERED LOGO (Perfect Match with Index Page) -->
      <div class="logo-container">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="fas fa-record-vinyl"></i></div>
          <div class="logo-text">VINYL OASIS<small>Analogue Studio</small></div>
        </a>
      </div>

      <!-- HEADING -->
      <h1 class="form-title">Welcome Back</h1>
      <p class="form-subtitle">Secure access to your curator console</p>

      <!-- LOGIN FORM -->
      <form id="loginForm" novalidate>
        
        <!-- EMAIL OR NAME INPUT -->
        <div class="input-group">
          <label for="usernameInput" class="input-label">Email or Username</label>
          <div class="input-wrapper">
            <input type="text" id="usernameInput" class="form-input" placeholder="Enter email or username..." required autocomplete="username">
            <i class="fas fa-envelope input-icon"></i>
          </div>
        </div>

        <!-- PASSWORD INPUT WITH EYE ICON -->
        <div class="input-group">
          <label for="passwordInput" class="input-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="passwordInput" class="form-input" placeholder="Enter entire password..." required autocomplete="current-password">
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- REMEMBER ME & FORGOT PASSWORD -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberCheck" defaultChecked>
            <span class="custom-checkbox"><i class="fas fa-check"></i></span>
            Remember me
          </label>
          <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('🔒 Password recovery instruction link dispatched to your registered address.');">Forgot password?</a>
        </div>

        <!-- SUBMIT ACTION -->
        <button type="submit" class="submit-btn">
          <span>Authenticate Session</span>
          <i class="fas fa-arrow-right-to-bracket" style="font-size: 14px;"></i>
        </button>

        <!-- OR CONTINUE WITH SOCIALS -->
        <div class="divider">
          <span>Or continue with</span>
        </div>

        <div class="social-logins">
          <a href="#" class="social-btn-card" aria-label="Continue with Google" onclick="event.preventDefault(); alert('🌐 Authenticating securely via Google Identity Vault...');">
            <i class="fa-brands fa-google"></i>
          </a>
          <a href="#" class="social-btn-card" aria-label="Continue with Facebook" onclick="event.preventDefault(); alert('🌐 Authenticating securely via Facebook Gate...');">
            <i class="fa-brands fa-facebook-f"></i>
          </a>
          <a href="#" class="social-btn-card" aria-label="Continue with Apple" onclick="event.preventDefault(); alert('🌐 Authenticating securely via Apple ID Core...');">
            <i class="fa-brands fa-apple"></i>
          </a>
        </div>

        <!-- SIGN UP ACTION REDIRECTING TO REGISTERATION.HTML -->
        <div class="register-prompt">
          Don't have an account? 
          <a href="registeration.html" class="register-link">Sign up</a>
        </div>

      </form>

    </div>
  </div>

  <script>
    (function(){
      const body = document.body;
      const darkToggle = document.getElementById('darkModeToggle');
      const rtlToggle = document.getElementById('rtlToggle');
      const eyeBtn = document.getElementById('eyeBtn');
      const passwordInput = document.getElementById('passwordInput');
      const loginForm = document.getElementById('loginForm');

      // ---------- DARK MODE ----------
      function setDarkMode(enabled) {
        if(enabled) body.classList.add('dark');
        else body.classList.remove('dark');
        localStorage.setItem('vinyl_dark', enabled ? 'true' : 'false');
        const icon = darkToggle?.querySelector('i');
        if(icon) {
          if(enabled) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
          else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
        }
      }
      const savedDark = localStorage.getItem('vinyl_dark') === 'true';
      if(savedDark) setDarkMode(true);
      darkToggle?.addEventListener('click', () => setDarkMode(!body.classList.contains('dark')));

      // ---------- RTL MODE ----------
      function setRTL(enabled) {
        if(enabled) body.classList.add('rtl');
        else body.classList.remove('rtl');
        localStorage.setItem('vinyl_rtl', enabled ? 'true' : 'false');
        const arrowIcon = rtlToggle?.querySelector('i');
        if(arrowIcon) {
          if(enabled) arrowIcon.classList.replace('fa-arrow-right', 'fa-arrow-left');
          else arrowIcon.classList.replace('fa-arrow-left', 'fa-arrow-right');
        }
      }
      const savedRTL = localStorage.getItem('vinyl_rtl') === 'true';
      if(savedRTL) setRTL(true);
      rtlToggle?.addEventListener('click', () => setRTL(!body.classList.contains('rtl')));

      // ---------- PASSWORD EYE TOGGLE ----------
      eyeBtn?.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        const icon = eyeBtn.querySelector('i');
        if(icon) {
          if(isPassword) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
          } else {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
          }
        }
      });

      // ---------- FORM SUBMISSION ----------
      loginForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const userVal = document.getElementById('usernameInput').value.trim();
        const passVal = passwordInput.value.trim();
        
        if(!userVal || !passVal) {
          alert('⚠️ Please fill in both your Email/Username and Password.');
          return;
        }

        alert('✨ Authentication Successful! Welcome back curator. Redirecting to Sanctuary Home...');
        window.location.href = 'index.html';
      });
    
      // ---------- MOBILE DRAWER ----------
      const mobileHamburger = document.getElementById('mobileHamburger');
      const mobileDrawer = document.getElementById('mobileDrawer');
      const drawerOverlay = document.getElementById('drawerOverlay');
      const closeDrawerBtn = document.getElementById('closeDrawer');
      const mobileDarkToggle = document.getElementById('mobileDarkToggle');
      const mobileRtlToggle = document.getElementById('mobileRtlToggle');
      const mobileLoginBtn = document.getElementById('mobileLoginBtn');
      const home1Option = document.getElementById('home1Option');
      const home2Option = document.getElementById('home2Option');
      const mobileHome1 = document.getElementById('mobileHome1');
      const mobileHome2 = document.getElementById('mobileHome2');

      // mobile toggles
      mobileDarkToggle?.addEventListener('click', () => { 
        const isDark = body.classList.contains('dark');
        if(!isDark) body.classList.add('dark'); else body.classList.remove('dark');
        localStorage.setItem('vinyl_dark', !isDark ? 'true' : 'false');
      });
      mobileRtlToggle?.addEventListener('click', () => { 
        const isRtl = body.classList.contains('rtl');
        if(!isRtl) body.classList.add('rtl'); else body.classList.remove('rtl');
        localStorage.setItem('vinyl_rtl', !isRtl ? 'true' : 'false');
      });
      mobileLoginBtn?.addEventListener('click', () => { window.location.href = './login.html'; });

      home1Option?.addEventListener('click', () => { closeDrawerIfOpen(); });
      home2Option?.addEventListener('click', () => { closeDrawerIfOpen(); });
      mobileHome1?.addEventListener('click', () => { closeDrawerIfOpen(); });
      mobileHome2?.addEventListener('click', () => { closeDrawerIfOpen(); });

      function closeDrawer() {
        if(mobileDrawer) mobileDrawer.classList.remove('open');
        if(drawerOverlay) drawerOverlay.style.display = 'none';
      }
      function closeDrawerIfOpen() {
        if(mobileDrawer?.classList.contains('open')) closeDrawer();
      }
      mobileHamburger?.addEventListener('click', () => {
        if(mobileDrawer) mobileDrawer.classList.add('open');
        if(drawerOverlay) drawerOverlay.style.display = 'block';
      });
      closeDrawerBtn?.addEventListener('click', closeDrawer);
      drawerOverlay?.addEventListener('click', closeDrawer);

      document.querySelectorAll('.mobile-dropdown').forEach(dropdown => {
        const header = dropdown.querySelector('div:first-child');
        header?.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdown.classList.toggle('active');
        });
      });

      })();
  </script>
</body>
</html>
